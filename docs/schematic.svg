<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 900" width="1140" height="900" font-family="'Helvetica Neue','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">
  <rect x="0" y="0" width="1140" height="900" fill="#ffffff"/>

  <text x="570" y="38" font-size="17" font-weight="bold" fill="#222" text-anchor="middle">JJYシミュレータ 回路図 — 現行構成（Step 5 RTC + Step 6 アンテナ増幅）</text>
  <text x="570" y="60" font-size="10.5" fill="#666" text-anchor="middle">Tang Nano 9K（GOWIN GW1NR-9）+ AE-RX8900 + 40kHz共振タンク・NPN増幅段 / I2C 100kHz・UART 115200bps・27MHz単一クロック</text>

  <g id="boxes">
    <rect x="50" y="330" width="130" height="85" rx="6" fill="#f4f4f4" stroke="#888" stroke-width="1.4"/>
    <text x="115" y="358" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">PC</text>
    <text x="115" y="378" font-size="9.5" fill="#555" text-anchor="middle">jjy_sync.py 常駐</text>
    <text x="115" y="394" font-size="9.5" fill="#555" text-anchor="middle">NTP同期時刻を送信</text>

    <rect x="250" y="170" width="250" height="470" rx="6" fill="#eef4fb" stroke="#2c5f8a" stroke-width="1.6"/>
    <text x="375" y="196" font-size="13" font-weight="bold" fill="#1a3c5e" text-anchor="middle">Tang Nano 9K</text>
    <text x="375" y="213" font-size="9" fill="#667788" text-anchor="middle">GOWIN GW1NR-9</text>
    <text x="375" y="262" font-size="9" fill="#556" text-anchor="middle">27MHz XO（pin52）→ ÷675 → 40kHz</text>
    <text x="375" y="279" font-size="9" fill="#556" text-anchor="middle">USB-UARTブリッジ → uart_rx（18）</text>
    <text x="375" y="296" font-size="9" fill="#556" text-anchor="middle">LED1〜6・S1/S2 オンボード（下欄参照）</text>

    <rect x="830" y="225" width="210" height="375" rx="6" fill="#fdf6ec" stroke="#b9770e" stroke-width="1.6"/>
    <text x="935" y="250" font-size="13" font-weight="bold" fill="#7a4a00" text-anchor="middle">AE-RX8900</text>
    <text x="935" y="568" font-size="9" fill="#776655" text-anchor="middle">EPSON RX8900SA（DTCXO ±5ppm）</text>
    <text x="935" y="584" font-size="9" fill="#776655" text-anchor="middle">I2Cスレーブアドレス 0x32</text>
  </g>

  <g id="rail-33v" stroke="#c0392b" stroke-width="2.2" fill="none">
    <path d="M540 120 H805 V300 H830"/>
