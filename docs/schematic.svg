      <path d="M112 633 L100 643"/>
      <path d="M100 643 V780"/>
      <path d="M112 625 H126"/>
      <path d="M158 625 H168 V560 H250"/>
      <path d="M195 496 V514"/>
      <path d="M232 493 V514"/>
    </g>
    <path d="M112 512 H132 M112 519 H132" stroke="#222" stroke-width="2" fill="none"/>
    <path d="M112 612 V638" stroke="#222" stroke-width="3" fill="none"/>
    <polygon points="100,643 103.5,636.2 107.3,640.8" fill="#222"/>
    <rect x="126" y="617" width="32" height="16" fill="#fff" stroke="#222" stroke-width="1.6"/>
    <text x="142" y="610" font-size="9" fill="#333" text-anchor="middle">1kΩ</text>
    <text x="40" y="520" font-size="9" fill="#333" text-anchor="middle">ループ</text>
    <text x="40" y="534" font-size="9" fill="#333" text-anchor="middle">アンテナ</text>
    <text x="136" y="516" font-size="8.5" fill="#333">4.7nF</text>
    <text x="136" y="530" font-size="8" fill="#666">40kHz共振</text>
    <text x="110" y="662" font-size="9" fill="#333">BTN5551A3-Q</text>
    <text x="110" y="676" font-size="8.5" fill="#666">NPN 増幅段</text>

    <path d="M186 486 H204" stroke="#222" stroke-width="2" fill="none"/>
    <path d="M186 493 Q195 499 204 493" stroke="#222" stroke-width="2" fill="none"/>
    <text x="182" y="481" font-size="9" font-weight="bold" fill="#333" text-anchor="end">+</text>
    <path d="M186 514 H204 M190 518.5 H200 M193 522.5 H197" stroke="#222" stroke-width="1.8" fill="none"/>
    <text x="195" y="535" font-size="8.5" fill="#333" text-anchor="middle">47μF</text>

    <path d="M223 486 H241 M223 493 H241" stroke="#222" stroke-width="2" fill="none"/>
    <path d="M223 514 H241 M227 518.5 H237 M230 522.5 H234" stroke="#222" stroke-width="1.8" fill="none"/>
    <text x="232" y="535" font-size="8.5" fill="#333" text-anchor="middle">0.1μF</text>
  </g>

  <g id="parts">
    <rect x="672" y="170" width="16" height="40" fill="#fff" stroke="#222" stroke-width="1.6"/>
    <rect x="732" y="170" width="16" height="40" fill="#fff" stroke="#222" stroke-width="1.6"/>
    <text x="710" y="163" font-size="9.5" fill="#333" text-anchor="middle">10kΩ×2 ※1</text>

    <rect x="668" y="672" width="40" height="16" fill="#fff" stroke="#222" stroke-width="1.6"/>
    <text x="688" y="665" font-size="9" fill="#333" text-anchor="middle">100Ω</text>

    <polygon points="724,669 724,691 748,680" fill="#222"/>
    <path d="M748 668 V692" stroke="#222" stroke-width="2.6" fill="none"/>
    <path d="M748 668 H743 V672 M748 692 H753 V688" stroke="#222" stroke-width="1.6" fill="none"/>
    <text x="736" y="657" font-size="9" fill="#333" text-anchor="middle">1N5817</text>

    <path d="M624 688 H656" stroke="#222" stroke-width="2" fill="none"/>
    <path d="M632 697 H648" stroke="#222" stroke-width="4" fill="none"/>
    <text x="614" y="693" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">+</text>
    <text x="652" y="716" font-size="9.5" fill="#333">CR2032</text>
    <text x="652" y="730" font-size="8.5" fill="#666">3V 一次電池 ※2</text>
  </g>

  <g id="pin-labels" font-family="Menlo,Consolas,monospace" font-size="9.5">
    <g text-anchor="end" fill="#223344">
      <text x="492" y="243">3V3</text>
      <text x="492" y="333">sda(26)</text>
      <text x="492" y="383">scl(27)</text>
      <text x="492" y="433">fout_1hz(28)</text>
      <text x="492" y="473" fill="#999">(29 予約)</text>
      <text x="492" y="508" fill="#999">(30 予約)</text>
      <text x="492" y="613">GND</text>
    </g>
    <g fill="#223344">
      <text x="258" y="375">USB</text>
      <text x="258" y="464">5V</text>
      <text x="258" y="563">carrier_ant(25)</text>
    </g>
    <g fill="#443322">
      <text x="838" y="273">VDD(8)</text>
      <text x="838" y="303">FOE(1)</text>
      <text x="838" y="333">SDA(5)</text>
      <text x="838" y="383">SCL(6)</text>
      <text x="838" y="433">FOUT(2)</text>
      <text x="838" y="473" fill="#999">/INT(3) N.C.</text>
      <text x="838" y="508">VBAT(7)</text>
      <text x="838" y="543">GND(4)</text>
    </g>
  </g>
  <text x="838" y="315" font-size="7.5" fill="#998866">※H固定=FOUT有効</text>

  <g id="signal-labels" fill="#333">
    <text x="215" y="362" font-size="8.5" text-anchor="middle">USB Type-C</text>
    <text x="215" y="388" font-size="8.5" fill="#555" text-anchor="middle">給電+UART</text>
    <text x="508" y="323" font-size="10">SDA ⇔</text>
    <text x="508" y="352" font-size="8.5" fill="#888">I2C 100kHz</text>
    <text x="508" y="373" font-size="10">SCL →</text>
    <text x="508" y="422" font-size="10">← FOUT 1Hz（秒境界規律）</text>
  </g>

  <g id="junctions">
    <g fill="#c0392b">
      <circle cx="560" cy="120" r="3.3"/>
      <circle cx="680" cy="120" r="3.3"/>
      <circle cx="740" cy="120" r="3.3"/>
      <circle cx="805" cy="270" r="3.3"/>
    </g>
    <g fill="#e67e22">
      <circle cx="195" cy="460" r="3.3"/>
      <circle cx="232" cy="460" r="3.3"/>
    </g>
    <g fill="#222">
      <circle cx="680" cy="330" r="3.3"/>
      <circle cx="740" cy="380" r="3.3"/>
      <circle cx="100" cy="495" r="3.3"/>
      <circle cx="100" cy="570" r="3.3"/>
    </g>
    <g fill="#2166ac">
      <circle cx="100" cy="780" r="3.3"/>
      <circle cx="560" cy="780" r="3.3"/>
      <circle cx="640" cy="780" r="3.3"/>
      <circle cx="810" cy="780" r="3.3"/>
    </g>
  </g>

  <g id="legend">
    <path d="M60 800 H1080" stroke="#ddd" stroke-width="1" fill="none"/>
    <text x="80" y="822" font-size="10" font-weight="bold" fill="#333">オンボード状態LED（アクティブロー）</text>
    <g font-size="9" fill="#444">
      <text x="80" y="842">LED1(p10) キャリアOOK</text>
      <text x="250" y="842">LED2(p11) 時刻ロード成功</text>
      <text x="430" y="842">LED3(p13) UART受信</text>
      <text x="80" y="860">LED4(p14) パーサ処理中</text>
      <text x="250" y="860">LED5(p15) フレーム先頭</text>
      <text x="430" y="860">LED6(p16) RTC時刻未確立</text>
    </g>
    <text x="620" y="822" font-size="10" font-weight="bold" fill="#333">配線</text>
    <path d="M620 838 H648" stroke="#c0392b" stroke-width="2.2" fill="none"/>
    <text x="652" y="842" font-size="9" fill="#444">3.3V</text>
    <path d="M620 856 H648" stroke="#e67e22" stroke-width="2.2" fill="none"/>
    <text x="652" y="860" font-size="9" fill="#444">5V</text>
    <path d="M700 838 H728" stroke="#2166ac" stroke-width="2.5" fill="none"/>
    <text x="732" y="842" font-size="9" fill="#444">GNDレール</text>
    <path d="M700 856 H728" stroke="#222" stroke-width="1.7" fill="none"/>
    <text x="732" y="860" font-size="9" fill="#444">信号</text>
    <path d="M620 874 H648" stroke="#999" stroke-width="1.4" stroke-dasharray="5 4" fill="none"/>
    <text x="652" y="878" font-size="9" fill="#444">予約（GPS拡張）</text>
    <text x="830" y="822" font-size="10" font-weight="bold" fill="#333">注記</text>
    <text x="830" y="842" font-size="8.5" fill="#444">※1 プルアップは外付け10kΩまたはJ1ショートの一方のみ</text>
    <text x="830" y="860" font-size="8.5" fill="#444">※2 CR2032は一次電池。1N5817で逆流（充電）を防止</text>
    <text x="830" y="878" font-size="8.5" fill="#444">※3 増幅段は微弱無線局の範囲（3m地点500μV/m以下）を厳守</text>
  </g>
</svg>
