    <path d="M500 505 H590"/>
  </g>
  <text x="596" y="474" font-size="9" fill="#999">GPS UART RX（予約）</text>
  <text x="596" y="509" font-size="9" fill="#999">GPS 1PPS（予約）</text>

  <g id="amp-stage">
    <g stroke="#222" stroke-width="1.7" fill="none">
      <path d="M78 495 H122"/>
      <path d="M78 495 V502"/>
