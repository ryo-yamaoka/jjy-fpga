    <path d="M740 120 V190"/>
  </g>
  <text x="532" y="124" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="end">3.3V</text>

  <g id="rail-gnd">
    <path d="M80 780 H840" stroke="#2166ac" stroke-width="2.5" fill="none"/>
    <text x="72" y="784" font-size="11" font-weight="bold" fill="#2166ac" text-anchor="end">GND</text>
  </g>

  <g id="rail-5v" stroke="#e67e22" stroke-width="2.2" fill="none">
    <path d="M250 460 H100 V495"/>
    <path d="M195 460 V486"/>
    <path d="M232 460 V486"/>
  </g>
  <text x="175" y="452" font-size="9" font-weight="bold" fill="#e67e22" text-anchor="middle">+5V（USB 5V）</text>

  <g id="wires" stroke="#222" stroke-width="1.7" fill="none">
    <path d="M180 372 H250" stroke-width="2.4"/>
    <path d="M500 330 H830"/>
    <path d="M500 380 H830"/>
    <path d="M500 430 H830"/>
